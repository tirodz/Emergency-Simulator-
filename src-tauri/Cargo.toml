[package]
name = "emergency-simulator"
version = "2.0.0"
description = "Emergency Simulator desktop controller for controlled Android CellBroadcast testing"
authors = ["TIRO"]
license = "MIT"
edition = "2021"

[lib]
name = "emergency_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
