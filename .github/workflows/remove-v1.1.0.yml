name: Remove superseded v1.1.0 release

on:
  push:
    branches: [rebuild/tauri-liquid-glass]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete v1.1.0 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          gh release delete v1.1.0 --repo "$REPO" --yes --cleanup-tag
