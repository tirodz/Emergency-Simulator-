name: Build Emergency Simulator Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emergency-simulator-windows
  cancel-in-progress: true

jobs:
  build-local-simulator:
    name: Build root-free local Android simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android local simulator
        working-directory: android/local-simulator
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Test the Android input validation and log-injection guard
        working-directory: android/local-simulator
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Archive Android unit test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Emergency-Simulator-android-test-results
          path: android/local-simulator/app/build/test-results/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: Emergency-Simulator-local-simulator-apk
          path: android/local-simulator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-injector:
    name: Build Android test injector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - name: Build injector from source
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: bash android/alertinject/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Emergency-Simulator-alertinject
          path: android/alertinject/out/alertinject.jar
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify desktop contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify source contract
        shell: bash
        run: |
          set -e
          test -f src/index.html
          test -f src-tauri/Cargo.toml
          test -f src-tauri/src/lib.rs
          test -f src-tauri/tauri.conf.json
          test -f src-tauri/icons/icon.png
          grep -q "Tauri + Rust" src/index.html
          grep -q "SEND TEST ALERT" src/index.html
          grep -q "Device workspace" src/index.html
          grep -q "backdrop-filter" src/index.html
          grep -q 'data-theme="oled"' src/index.html
          grep -q 'data-theme="light"' src/index.html
          grep -q "adb_diagnostics" src/index.html
          grep -q "send_test_alert" src/index.html
          grep -q "NO CELLULAR TRANSMISSION" src/index.html
          grep -q "send_test_alert" src-tauri/src/lib.rs
          grep -q "injector_command_script" src-tauri/src/lib.rs
          grep -q "cellbroadcast_candidates" src-tauri/src/lib.rs
          grep -q "sh_quote" src-tauri/src/lib.rs
          grep -q "targetPackage" android/alertinject/org/emergencysim/alertinject/AlertInjector.java
      - name: Validate embedded JavaScript syntax
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          text = Path("src/index.html").read_text(encoding="utf-8")
          start = text.find("<script>")
          end = text.rfind("</script>")
          if start < 0 or end < start:
              raise SystemExit("Missing inline JavaScript block")
          Path("frontend-check.js").write_text(text[start + 8:end], encoding="utf-8")
          PY
          node --check frontend-check.js
      - name: Run the desktop UI layout gate
        shell: bash
        run: |
          set -e
          npm install
          # The harness prefers a system Chromium and only falls back to Playwright's own browser
          # when there is none (tools/check_ui.mjs), so install one only if the runner lacks it.
          # It fails on a hidden measured panel, on document overflow, on text clipped inside its own
          # box, and on a dead overflow detector (BUG-022). A UI gate that cannot fail is worse than
          # no gate, so this runs on every PR.
          CHROMIUM="$(command -v chromium || command -v chromium-browser || command -v google-chrome || true)"
          if [ -z "$CHROMIUM" ]; then npx playwright install --with-deps chromium; fi
          CHROMIUM_PATH="$CHROMIUM" npm run test:ui
      - name: Check the controller stays read-only
        shell: bash
        run: |
          set -e
          # Fails if a state-changing ADB command reappears in the Rust sources. `adb root` was
          # being called on every refresh; it restarts adbd on the operator's phone as root and
          # enables nothing, because the AOSP test receiver is gated on ro.debuggable, not on uid.
          # See docs/bugs/BUG-024.
          python3 tools/check_read_only.py

  build:
    name: Build Windows app and installer
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [verify, build-injector, build-local-simulator]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
      - name: Install frontend dependencies
        shell: pwsh
        run: npm install
      - name: Generate Windows icon set
        shell: pwsh
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Validate generated icons
        shell: pwsh
        run: |
          foreach ($p in @(
            "src-tauri/icons/icon.ico",
            "src-tauri/icons/icon.png",
            "src-tauri/icons/32x32.png",
            "src-tauri/icons/128x128.png",
            "src-tauri/icons/128x128@2x.png"
          )) {
            if (-not (Test-Path $p)) { throw "Missing generated icon: $p" }
          }
      - name: Stage Android Platform Tools
        shell: pwsh
        run: |
          $stage = "packaging/platform-tools"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $zip = "$env:TEMP\platform-tools.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\pt" -Force
          Copy-Item "$env:TEMP\pt\platform-tools\adb.exe" -Destination "$stage\adb.exe" -Force
          Copy-Item "$env:TEMP\pt\platform-tools\AdbWinApi.dll" -Destination "$stage\AdbWinApi.dll" -Force
          Copy-Item "$env:TEMP\pt\platform-tools\AdbWinUsbApi.dll" -Destination "$stage\AdbWinUsbApi.dll" -Force
          & "$stage\adb.exe" start-server
          & "$stage\adb.exe" devices -l
      - name: Download Android injector
        uses: actions/download-artifact@v8
        with:
          name: Emergency-Simulator-alertinject
          path: android/alertinject/out
      - name: Download local simulator APK
        uses: actions/download-artifact@v8
        with:
          name: Emergency-Simulator-local-simulator-apk
          path: android/local-simulator/app/build/outputs/apk/debug
      - name: Verify packaged Android test components
        shell: pwsh
        run: |
          if (-not (Test-Path "android/alertinject/out/alertinject.jar")) { throw "Missing Android injector JAR." }
          if (-not (Test-Path "android/local-simulator/app/build/outputs/apk/debug/app-debug.apk")) { throw "Missing root-free local simulator APK." }
      - name: Run desktop controller unit tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - name: Build Tauri bundle
        shell: pwsh
        run: npx tauri build --ci
      - name: Validate release outputs
        shell: pwsh
        run: |
          $app = Get-ChildItem "src-tauri\target\release" -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notmatch "\\bundle\\nsis\\" } | Select-Object -First 1
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $app) { throw "Tauri application EXE missing." }
          if (-not $setup) { throw "Tauri NSIS installer missing." }
          New-Item -ItemType Directory -Path release-output -Force | Out-Null
          Copy-Item $app.FullName "release-output\Emergency-Simulator-v1.0.0.exe" -Force
          Copy-Item $setup.FullName "release-output\Emergency-Simulator-Setup-1.0.0.exe" -Force
          Get-FileHash "release-output\Emergency-Simulator-v1.0.0.exe" -Algorithm SHA256 | Format-List
          Get-FileHash "release-output\Emergency-Simulator-Setup-1.0.0.exe" -Algorithm SHA256 | Format-List
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          # A checksum file is shipped next to the binaries so an operator can confirm the installer
          # they downloaded is the one this build produced. The hashes were previously only printed
          # into the build log, which nobody downloading a release can read.
          $lines = foreach ($name in @(
            "Emergency-Simulator-v1.0.0.exe",
            "Emergency-Simulator-Setup-1.0.0.exe"
          )) {
            $path = "release-output\$name"
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          Set-Content -Path "release-output\SHA256SUMS.txt" -Value $lines -Encoding ascii
          Get-Content "release-output\SHA256SUMS.txt"
      - name: Verify the checked-in Android sources still describe themselves honestly
        shell: pwsh
        run: |
          # The stock-device path is a local notification, never a Cell Broadcast. If a future edit
          # starts claiming otherwise in the Kotlin, this fails rather than letting the overclaim
          # ship inside a release.
          $manifest = Get-Content "android/local-simulator/app/src/main/AndroidManifest.xml" -Raw
          if ($manifest -match "SMS_CB_RECEIVED" -or $manifest -match "SMS_EMERGENCY_CB_RECEIVED") {
            throw "The local simulator must not claim the protected Cell Broadcast actions."
          }
          $readme = Get-Content "README.md" -Raw
          if ($readme -notmatch "not a Cell Broadcast") {
            throw "README must state that the local simulator output is not a Cell Broadcast."
          }

      - uses: actions/upload-artifact@v7
        with:
          name: Emergency-Simulator-v1-windows
          path: release-output
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish v1.0.0 GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - name: Replace obsolete releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.0.0 --cleanup-tag --yes || true
          gh release delete v1.0.0 --cleanup-tag --yes || true
      - uses: actions/download-artifact@v8
        with:
          name: Emergency-Simulator-v1-windows
          path: release-assets
      - name: Publish v1.0.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            # Emergency Simulator v1.0.0

            A Windows desktop console for **controlled** Android CellBroadcast alert testing.

            > This application does not transmit cellular signals, inject RF, impersonate a carrier,
            > or operate a cellular network.

            ## What ships

            | File | Purpose |
            | --- | --- |
            | `Emergency-Simulator-Setup-1.0.0.exe` | NSIS installer (current-user, no admin needed) |
            | `Emergency-Simulator-v1.0.0.exe` | Portable application binary |
            | `SHA256SUMS.txt` | SHA-256 of both binaries above |

            Verify a download with:

            ~~~powershell
            Get-FileHash .\Emergency-Simulator-Setup-1.0.0.exe -Algorithm SHA256
            ~~~

            The bundled Platform Tools (adb), the Android test injector, and the root-free local
            simulator APK are packaged inside the application, so no JDK, Android SDK, or separate
            adb install is required.

            ## Two modes, deliberately kept apart

            **Controlled development mode.** The real `CellBroadcastReceiver` ->
            `CellBroadcastAlertService` -> `CellBroadcastAlertDialog` chain produces a genuine alert.
            This requires a rooted or `userdebug` target, because the AOSP test entry point is gated
            on `ro.debuggable=1`.

            **Stock device mode.** An ordinary retail phone with no root. The bundled local
            simulator posts a high-importance notification with a full-screen intent, a bundled
            emergency attention tone, and vibration. **It is a local app notification and not a Cell
            Broadcast**, and it will not appear as an emergency alert. It is not demonstrated to
            produce a real Cell Broadcast on stock firmware, and nothing in this release claims it
            does.

            A real Cell Broadcast cannot be triggered over ADB on stock firmware. The action
            `android.provider.Telephony.SMS_CB_RECEIVED` is a `<protected-broadcast>`, and the ADB
            shell user (uid 2000) is absent from `ActivityManagerService`'s system-caller exemption
            list, so the attempt is refused with a `SecurityException` before it reaches any
            receiver. See `docs/stock-device/why-adb-cannot-send-sms-cb-received.md` for the source
            citations.

            ## Delivery is judged from device evidence, never from an exit code

            `adb` exiting 0 does not mean an alert appeared. Every verdict is decided from
            downstream `logcat` stage lines, and an absence of evidence is reported as `UNCERTAIN`
            rather than as success.

            ## Requirements

            * Windows 10 or 11
            * An Android device with USB debugging enabled
            * For controlled mode only: a rooted or `userdebug` target
          files: |
            release-assets/Emergency-Simulator-v1.0.0.exe
            release-assets/Emergency-Simulator-Setup-1.0.0.exe
            release-assets/SHA256SUMS.txt

