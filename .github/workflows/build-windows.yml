name: Build Tauri Windows desktop

on:
  push:
    branches: [main, rebuild/tauri-liquid-glass]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify glass frontend contract
        shell: bash
        run: |
          set -e
          test -f src/index.html
          test -f src-tauri/Cargo.toml
          test -f src-tauri/src/lib.rs
          test -f src-tauri/tauri.conf.json
          test -f src-tauri/icons/icon.png
          grep -q "Tauri + Rust" src/index.html
          grep -q "SEND TEST ALERT" src/index.html
          grep -q "backdrop-filter" src/index.html
          grep -q 'data-theme="midnight"' src/index.html
          grep -q 'data-accent="green"' src/index.html
          grep -q "UNAUTHORIZED" src/index.html
          grep -q "STOCK / UNPROVEN" src/index.html
          grep -q "NO CELLULAR TRANSMISSION" src/index.html
          grep -q "window_toggle_maximize" src/index.html
          grep -q "send_test_alert" src/index.html

  build:
    name: Build Windows app + installer
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
      - name: Stage Android Platform Tools
        shell: pwsh
        run: |
          $stage = "packaging/platform-tools"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $zip = "$env:TEMP\platform-tools.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\pt" -Force
          Copy-Item "$env:TEMP\pt\platform-tools\adb.exe" -Destination "$stage\adb.exe" -Force
          Copy-Item "$env:TEMP\pt\platform-tools\AdbWinApi.dll" -Destination "$stage\AdbWinApi.dll" -Force
          Copy-Item "$env:TEMP\pt\platform-tools\AdbWinUsbApi.dll" -Destination "$stage\AdbWinUsbApi.dll" -Force
          & "$stage\adb.exe" version
      - name: Verify Android injector
        shell: pwsh
        run: |
          if (-not (Test-Path "android/alertinject/out/alertinject.jar")) { throw "Missing android injector JAR." }
      - name: Install frontend
        run: npm install
      - name: Build Tauri bundle
        run: npx tauri build --ci
      - name: Validate and normalize outputs
        shell: pwsh
        run: |
          $app = Get-ChildItem "src-tauri\target\release" -Filter "*.exe" -Recurse |
            Where-Object { $_.FullName -notmatch "\\bundle\\nsis\\" } |
            Select-Object -First 1
          $setup = Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "*.exe" |
            Select-Object -First 1
          if (-not $app) { throw "Tauri application EXE was not produced." }
          if (-not $setup) { throw "Tauri NSIS installer was not produced." }
          New-Item -ItemType Directory -Path release-output -Force | Out-Null
          Copy-Item $app.FullName "release-output\Emergency-Simulator-v2.0.0.exe" -Force
          Copy-Item $setup.FullName "release-output\Emergency-Simulator-Setup-2.0.0.exe" -Force
          Get-Item "release-output\*.exe" | Format-Table Name,Length
      - name: Report hashes
        shell: pwsh
        run: |
          Get-FileHash "release-output\Emergency-Simulator-v2.0.0.exe" -Algorithm SHA256 | Format-List
          Get-FileHash "release-output\Emergency-Simulator-Setup-2.0.0.exe" -Algorithm SHA256 | Format-List
      - name: Upload release outputs
        uses: actions/upload-artifact@v7
        with:
          name: Emergency-Simulator-v2-windows
          path: release-output
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish v2.0.0 GitHub release
    needs: build
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Emergency-Simulator-v2-windows
          path: release-assets
      - name: Publish v2.0.0
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v2.0.0
          target_commitish: \${{ github.sha }}
          generate_release_notes: true
          files: |
            release-assets/Emergency-Simulator-v2.0.0.exe
            release-assets/Emergency-Simulator-Setup-2.0.0.exe
